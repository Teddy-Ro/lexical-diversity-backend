services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lexical-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 20

  minio-seed:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    volumes:
      - ../lexical-diversity-frontend/minio-seed:/seed:ro
    entrypoint: ["/bin/sh", "/seed/seed-minio.sh"]

volumes:
  lexical-minio-data:
