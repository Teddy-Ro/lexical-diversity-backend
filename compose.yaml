services:
  author_texts-backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: author_texts-backend
    depends_on:
      ttr-postgres:
        condition: service_healthy
    environment:
      AUTHOR_TEXTS_DATABASE_URL: postgresql+asyncpg://author_texts_user:ttr_password@ttr-postgres:5432/author_texts_database
      AUTHOR_TEXTS_FRONTEND_ROOT: /app/frontend
      AUTHOR_TEXTS_MINIO_PUBLIC_URL: http://localhost:9000/author-texts-media
      AUTHOR_TEXTS_CURRENT_USER_ID: 1
    ports:
      - "8000:8000"
    volumes:
      - ../lexical-diversity-frontend:/app/frontend:ro

  ttr-postgres:
    image: postgres:16-alpine
    container_name: ttr-postgres
    environment:
      POSTGRES_DB: author_texts_database
      POSTGRES_USER: author_texts_user
      POSTGRES_PASSWORD: ttr_password
    ports:
      - "55432:5432"
    volumes:
      - author_texts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U author_texts_user -d author_texts_database"]
      interval: 3s
      timeout: 3s
      retries: 20

  ttr-adminer:
    image: adminer:4
    container_name: ttr-adminer
    depends_on:
      ttr-postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: ttr-postgres
    ports:
      - "8080:8080"

  ttr-minio:
    image: minio/minio:latest
    container_name: ttr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - author_texts-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 20

  ttr-minio-seed:
    image: minio/mc:latest
    depends_on:
      ttr-minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@ttr-minio:9000
    volumes:
      - ../lexical-diversity-frontend/minio-seed:/seed:ro
    entrypoint: ["/bin/sh", "/seed/author_texts_seed_minio.sh"]

volumes:
  author_texts-postgres-data:
    # Keep the existing data volume when renaming the application's services.
    name: lexical-diversity-backend_ttr-postgres-data
  author_texts-minio-data:
    name: lexical-diversity-backend_ttr-minio-data
